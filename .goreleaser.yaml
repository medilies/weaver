version: 2

builds:
  - main: ./cmd/weave
    binary: weave
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - '^(docs|test|chore|ci|build)(\(.+\))?!?:'
      - "^Merge"
