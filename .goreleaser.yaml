version: 2

builds:
  - main: ./cmd/weave
    binary: weave
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - files: [LICENSE, README.md]

nfpms:
  - package_name: weaver
    homepage: https://github.com/medilies/weaver
    maintainer: medilies
    description: Drives tmux sessions, windows and panes from a per-project YAML config.
    license: MIT
    section: utils
    formats: [deb]
    dependencies: [tmux]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/weaver/copyright

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - '^(docs|test|chore|ci|build)(\(.+\))?!?:'
      - "^Merge"
