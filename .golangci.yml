version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/session/domain/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/medilies/weaver/internal/session/domain # its own external tests
        app:
          files:
            - "**/internal/session/app/*.go"
          list-mode: strict
          allow:
            - $gostd
            - github.com/medilies/weaver/internal/session/domain
            - github.com/medilies/weaver/internal/session/app # its own external tests

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/medilies/weaver
