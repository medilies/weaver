version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        domain:
          files:
            - "**/internal/session/domain/*.go"
          deny:
            - pkg: github.com/spf13/cobra
              desc: domain must stay framework-free
            - pkg: github.com/medilies/weaver/internal/session/app
              desc: domain must not depend inward on the application layer
            - pkg: github.com/medilies/weaver/internal/session/infra
              desc: domain must not depend on infrastructure
            - pkg: github.com/medilies/weaver/cmd/weaver
              desc: domain must not depend on the cmd layer
        app:
          files:
            - "**/internal/session/app/*.go"
          deny:
            - pkg: github.com/spf13/cobra
              desc: application must stay framework-free
            - pkg: github.com/medilies/weaver/internal/session/infra
              desc: application must depend on domain ports, not infrastructure directly
            - pkg: github.com/medilies/weaver/cmd/weaver
              desc: application must not depend on the cmd layer

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/medilies/weaver
