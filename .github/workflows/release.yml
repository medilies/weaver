name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # 24.04 ships tmux 3.4, the only version weaver is tested on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Nothing is published that fails the tests.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: go test ./...
      - run: go test -tags terminal .
        working-directory: test/terminal
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A flat apt repository holding the release's packages, signed with
      # the key in the APT_SIGNING_KEY secret, served from GitHub Pages.
      - name: Build the apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          mkdir apt
          cp dist/*.deb apt/
          cd apt
          gpg --batch --import <<< "$APT_SIGNING_KEY"
          gpg --export > weaver.gpg
          apt-ftparchive packages . > Packages
          gzip -k9 Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=weaver \
            -o APT::FTPArchive::Release::Label=weaver \
            release . > Release
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes -abs -o Release.gpg Release
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apt

  apt:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
