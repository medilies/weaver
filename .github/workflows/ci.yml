name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      # The terminal tests are a module of their own, behind a build tag.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: test/terminal
          args: --build-tags terminal

  test:
    # 24.04 ships tmux 3.4, the only version weaver is tested on.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The shell the tmux adapter's tests run their panes in.
        shell: [/bin/sh, bash, zsh, fish]
    name: test (${{ matrix.shell }})
    env:
      WEAVE_TEST_SHELL: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The tmux adapter's tests drive a private tmux server.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux zsh fish
      - run: go test ./...

  test-macos:
    runs-on: macos-latest
    env:
      # The only version weaver is tested on, built from its release, as
      # Homebrew only has the newest.
      TMUX_VERSION: "3.4"
      # Not /var/folders, a symlink tmux resolves in the paths it reports.
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The tmux adapter's tests drive a private tmux server.
      - name: Build tmux
        run: |
          brew install libevent ncurses utf8proc pkgconf
          curl -fsSL "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz" | tar xz
          cd "tmux-$TMUX_VERSION"
          PKG_CONFIG_PATH="$(brew --prefix ncurses)/lib/pkgconfig" ./configure --enable-utf8proc --prefix="$RUNNER_TEMP/tmux"
          make -j"$(sysctl -n hw.ncpu)" install
          echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - run: test "$(tmux -V)" = "tmux $TMUX_VERSION"
      - run: go test ./...

  terminal:
    # weave in a real terminal emulator, attached to a private tmux server.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: test/terminal/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      - run: go test -tags terminal . -traces "$RUNNER_TEMP/traces"
        working-directory: test/terminal
      # A failed test's trace: open trace.html, or read trace.md.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-traces
          path: ${{ runner.temp }}/traces
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
