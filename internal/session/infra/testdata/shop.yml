# yaml-language-server: $schema=./weaver.schema.json
root: ~/dev/shop
repositories:
  back: git@bitbucket.org:acme/shop-back.git
  front: git@bitbucket.org:acme/shop-front.git
env:
  APP_ENV: local
before:
  - source ~/.shop_aliases
windows:
  - name: shop
    before:
      - git fetch --quiet
    panes:
      - name: back
        dir: back
        before:
          - alias php=php8.4
      - name: front
        dir: front
        split:
          direction: right
          size: 30%
        before:
          - nvm use 20
        note:
          - ""
          - 'Usual commands:'
          - ""
          - '  npm i'
          - '  npm run dev'
          - ""
        env:
          APP_ENV: dev
