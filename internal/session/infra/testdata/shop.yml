# yaml-language-server: $schema=./weaver.schema.json
root: ~/dev/shop
env:
  APP_ENV: local
before:
  - source ~/.shop_aliases
clear: true
windows:
  - name: shop
    before:
      - git fetch --quiet
    panes:
      - name: back
        dir: back
        before:
          - alias php=php8.4
        clear: false
        tasks:
          - {name: migrate, command: php artisan migrate}
          - {command: 'php artisan db:seed'}
      - name: front
        dir: front
        split:
          direction: right
          size: 30%
        before:
          - nvm use 20
        note:
          - ""
          - 'Usual commands:'
          - ""
          - '  npm i'
          - '  npm run dev'
          - ""
        env:
          APP_ENV: dev
