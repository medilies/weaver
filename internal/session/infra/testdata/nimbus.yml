# yaml-language-server: $schema=./weaver.schema.json
root: ~/dev/nimbus
repositories:
  .: https://github.com/medilies/nimbus.git
windows:
  - name: api
    panes:
      - name: api shell
        dir: api
      - name: task dev
        dir: api
        split:
          direction: right
          size: 40%
        command: task dev
      - name: psql
        split:
          direction: below
        command: nimbus psql
  - name: app
    panes:
      - name: app shell
        dir: app
      - name: flutter run
        dir: app
        split:
          direction: right
          size: 40%
        command: nimbus app
      - name: emulator
        split:
          direction: below
          size: 30%
        prefill: nimbus emulator
  - name: repo
