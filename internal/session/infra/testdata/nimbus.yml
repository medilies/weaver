# yaml-language-server: $schema=./weaver.schema.json
root: ~/dev/nimbus
windows:
  - name: api
    dir: api
    panes:
      - name: api shell
      - name: task dev
        split:
          direction: right
          size: 40%
        command: task dev
      - name: psql
        dir: .
        split:
          direction: below
        command: nimbus psql
  - name: app
    focus: true
    dir: app
    panes:
      - name: app shell
      - name: flutter run
        focus: true
        split:
          direction: right
          size: 40%
        command: nimbus app
      - name: emulator
        dir: .
        split:
          direction: below
          size: 30%
        prefill: nimbus emulator
  - name: repo
